<!DOCTYPE html>
<html>
<head>
    <title>Smart Lighting System</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Lighting System</h1>
        <p>Real-time people detection system</p>
    </header>

    <main>

        <div class="card camera-card">

            <div class="card-header">
                <h2>Camera</h2>
            </div>

            <div class="image-container">
                <img id="reloadImage" alt="Camera image">
            </div>
        </div>


        <div class="card chart-card">

            <div class="card-header">
                <h2>People detected</h2>
                <span>YOLOv8 — confidence 10%</span>
            </div>

            <div class="chart-container">
                <canvas id="personCountChart"></canvas>
            </div>

        </div>

    </main>

    <footer>
        Smart Lighting System — Práctica 2
    </footer>

    <script src="script.js"></script>

</body>
</html>
